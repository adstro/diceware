name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spelling:
    name: American English (en-US)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git ls-files -z | xargs -0 pipx run codespell==2.4.3

  analysis-bypasses:
    name: Approved analysis bypasses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/analysis-exceptions.py

  android:
    name: Core (JVM) + Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Static analysis (detekt, Android Lint)
        run: >-
          ./gradlew detekt :shared:detektMainAndroid :shared:detektHostTestAndroid
          :androidApp:detektDebug :androidApp:detektDebugUnitTest :androidApp:lintDebug :androidApp:lintRelease
      - name: Tests and coverage minimums (Kover)
        run: ./gradlew :shared:koverVerifyAndroid :androidApp:koverVerifyDebug :androidApp:assembleDebug

  ios:
    name: Core (iOS) + iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Static analysis (SwiftLint)
        working-directory: iosApp
        run: |
          curl -sSLo "$RUNNER_TEMP/swiftlint.zip" https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --quiet
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :shared:iosSimulatorArm64Test
      - name: iOS app tests
        working-directory: iosApp
        run: |
          # Runner images differ in simulators, so pick the first available iPhone.
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -project iosApp.xcodeproj -scheme iosApp \
            -destination "platform=iOS Simulator,id=$udid" CODE_SIGNING_ALLOWED=NO
